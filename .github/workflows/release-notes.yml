name: Release notes

on:
  pull_request:
    branches: [website]
    paths:
      - ".github/workflows/sync-site-changelog.yml"
      - "site/src/data/releases.json"
      - "site/scripts/releases/**"
      - "site/scripts/release-event.mjs"
      - "site/src/pages/changelog/**"
      - "site/src/components/ChangelogPage.astro"
      - "site/src/data/releases.ts"
      - "site/src/styles/changelog.css"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: node site/scripts/releases/release-notes.mjs validate
      - run: node --test site/scripts/releases/*.test.mjs
